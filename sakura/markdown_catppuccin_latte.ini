;   RK1 = Maroon  (5345e6) - bold (** __ *** ___)
;   RK2 = Pink    (cb76ea) - italic (* _)
;   RK3 = Blue    (f5661e) - heading (# == --)
;   RK4 = Peach   (0b64fe) - inline code `...`
;   RK5 = Mauve   (ef3988) - link / image text, footnote ref
;   RK6 = Sky     (e5a504) - URL, autolink, ref-def URL (underlined)
;   RK7 = Subtext0(856f6c) - blockquote
;   RK8 = Yellow  (1d8edf) - list marker, table, task checkbox
;   RK9 = Overlay1(a18f8c) - horizontal rule, strikethrough
;   RKA = Teal    (999217) - fenced code marker, ref-def label

