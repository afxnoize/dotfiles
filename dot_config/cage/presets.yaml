presets:
  base:
    allow:
      - "." # current
      - "$XDG_CACHE_HOME" # ~/.cache
      - "$XDG_STATE_HOME" # ~/.local/state (zsh history, nvim state)
      - "$XDG_DATA_HOME/rtk" # rtk gain
      - "$XDG_DATA_HOME/zoxide" # zoxide db
      - "$XDG_DATA_HOME/lesshst"
      - "$XDG_DATA_HOME/pnpm"
      - "$XDG_DATA_HOME/direnv" # direnv allow hashes
      - "$TMPDIR"
      - "/tmp"
      - "/dev/ptmx" # pseudo-terminal master
      - "/dev/pts" # pseudo-terminal slaves
      - "$XDG_DATA_HOME/direnv"
      - "$HOME/.aws/login/cache"
      - "$HOME/.aws/cli/cache"

  git-enabled:
    allow-git: true

  ai-coding:
    # $CLAUDE_CONFIG_DIR must stay writable: Claude atomically rewrites root-level files there (temp + rename).
    # The Telegram allowlist is pinned per session by TELEGRAM_ACCESS_MODE=static (zshenv).
    # Residual risk: settings.json/hooks edited inside cage apply on the next launch
    # until a root-owned managed-settings file is used.
    allow:
      - "$CLAUDE_CONFIG_DIR"
      - "$CODEX_HOME"
      - "$HOME/.serena"
      - ".serena"

  dev-tools:
    allow:
      - "$CARGO_HOME"
      - "$DENO_DIR"
      - "$GOPATH/pkg"
      - "$HOME/.docker"

  cloud-storage:
    allow:
      - "$XDG_CONFIG_HOME/b2"
      - "$XDG_CONFIG_HOME/kopia"
      - "$XDG_CONFIG_HOME/granted"
      - "$XDG_STATE_HOME/granted"

auto-presets:
  - command: claude
    presets:
      - base
      - git-enabled
      - ai-coding
      - dev-tools
      - cloud-storage
