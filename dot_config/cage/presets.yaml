presets:
  base:
    allow:
      - "." # current
      - "$XDG_CACHE_HOME" # ~/.cache
      - "$XDG_STATE_HOME" # ~/.local/state (zsh history, nvim state)
      - "$XDG_DATA_HOME/rtk" # rtk gain
      - "$XDG_DATA_HOME/zoxide" # zoxide db
      - "$XDG_DATA_HOME/lesshst"
      - "$XDG_DATA_HOME/pnpm"
      - "$XDG_DATA_HOME/direnv" # direnv allow hashes
      - "$TMPDIR"
      - "/tmp"
      - "/dev/ptmx" # pseudo-terminal master
      - "/dev/pts" # pseudo-terminal slaves

  git-enabled:
    allow-git: true

  ai-coding:
    allow:
      - "$CLAUDE_CONFIG_DIR"
      - "$CODEX_HOME"
      - "$HOME/.serena"
      - ".serena"

  dev-tools:
    allow:
      - "$CARGO_HOME"
      - "$DENO_DIR"
      - "$GOPATH"
      - "$HOME/.docker"

  cloud-storage:
    allow:
      - "$XDG_CONFIG_HOME/b2"
      - "$XDG_CONFIG_HOME/kopia"
      - "$XDG_CONFIG_HOME/granted"
      - "$XDG_STATE_HOME/granted"

auto-presets:
  - command: claude
    presets:
      - base
      - git-enabled
      - ai-coding
      - dev-tools
      - cloud-storage
