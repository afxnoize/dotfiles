presets:
  base:
    allow:
      - "." # current
      - "$XDG_CACHE_HOME" # ~/.cache
      # Not the whole of $XDG_STATE_HOME: unsandboxed processes load code from it.
      # nix/profiles holds the symlinks behind ~/.nix-profile (PATH), mise/trusted-configs
      # decides which .mise.toml may run, nvim/view is sourced by the loadview autocmd and
      # nvim/lazy/pkg-cache.lua is loaded by lazy.nvim. Grant only the data-only parts.
      # Side effect: nvim started inside cage reports a lazy.nvim error (pkg-cache.lua is read-only).
      - "$XDG_STATE_HOME/zsh" # shell history
      - "$XDG_STATE_HOME/claude" # claude locks
      - "$XDG_STATE_HOME/mise/tracked-configs"
      - "$XDG_STATE_HOME/pnpm"
      - "$XDG_STATE_HOME/nvim/shada"
      - "$XDG_STATE_HOME/nvim/logs"
      - "$XDG_STATE_HOME/nvim/undo"
      - "$XDG_STATE_HOME/nvim/backup"
      - "$XDG_DATA_HOME/rtk" # rtk gain
      - "$XDG_DATA_HOME/zoxide" # zoxide db
      - "$XDG_DATA_HOME/lesshst"
      - "$XDG_DATA_HOME/pnpm"
      - "$XDG_DATA_HOME/direnv" # direnv allow hashes
      - "$TMPDIR"
      - "/tmp"
      - "/dev/ptmx" # pseudo-terminal master
      - "/dev/pts" # pseudo-terminal slaves
      - "$XDG_DATA_HOME/direnv"
      - "$HOME/.aws/login/cache"
      - "$HOME/.aws/cli/cache"

  git-enabled:
    allow-git: true

  ai-coding:
    # $CLAUDE_CONFIG_DIR must stay writable: Claude atomically rewrites root-level files there (temp + rename).
    # The Telegram allowlist is pinned per session by TELEGRAM_ACCESS_MODE=static (zshenv).
    # Residual risk: settings.json/hooks edited inside cage apply on the next launch
    # until a root-owned managed-settings file is used.
    allow:
      - "$CLAUDE_CONFIG_DIR"
      - "$CODEX_HOME"
      - "$HOME/.serena"
      - ".serena"

  dev-tools:
    allow:
      - "$CARGO_HOME"
      - "$DENO_DIR"
      - "$GOPATH/pkg"
      - "$HOME/.docker"

  cloud-storage:
    allow:
      - "$XDG_CONFIG_HOME/b2"
      - "$XDG_CONFIG_HOME/kopia"
      - "$XDG_CONFIG_HOME/granted"
      - "$XDG_STATE_HOME/granted"

auto-presets:
  - command: claude
    presets:
      - base
      - git-enabled
      - ai-coding
      - dev-tools
      - cloud-storage
