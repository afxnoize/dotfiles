# basics {{{
[[snippets]]
name = "jj"
trigger = "jj"
snippet = "nix run github:martinvonz/jj"
# }}}

[[snippets]]
name = "jj status"
trigger = "st"
snippet = "status"
global = true
context = '^nix run github:martinvonz/jj\s+\S+$'

[[snippets]]
name = "jj file"
trigger = "f"
snippet = "file"
global = true
context = '^nix run github:martinvonz/jj\s+\S+$'

[[snippets]]
name = "jj file untrack"
trigger-pattern = "^un?t?$"
snippet = "untrack"
global = true
context = '^nix run github:martinvonz/jj\s+file\s+\S+$'

[[snippets]]
name = "jj describe"
trigger-pattern = "^de?s$"
snippet = 'describe -m="{}"'
cursor = "{}"
global = true
context = '^nix run github:martinvonz/jj\s+\S+$'

[[snippets]]
name = "jj new"
