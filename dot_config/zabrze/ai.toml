# commit / review {{{
[[snippets]]
name = "ai commit message"
trigger = "aicm"
snippet = """
git commit -e -m "$(git diff --staged | claude -p 'Write a comprehensive conventional commit message for this diff. Output only the message, no markdown or backticks:')"
"""
# }}}

# execution {{{
[[snippets]]
name = "cage claude"
trigger = "ccc"
snippet = "cage claude"

[[snippets]]
name = "claude channels (telegram)"
trigger = "ch"
snippet = "--channels plugin:telegram@claude-plugins-official"
global = true
context = '^(?:cage\s+)?claude(?:\s+-\S+)*\s+\S+$'

[[snippets]]
name = "happy"
trigger = "hp"
snippet = "happy"

[[snippets]]
name = "skills add"
