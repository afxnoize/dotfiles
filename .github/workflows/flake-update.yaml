name: Update flake.lock

on:
  schedule:
    - cron: "0 20 * * 0" # 毎週月曜 05:00 JST (= 日曜 20:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake.lock
        working-directory: nix
        run: nix flake update

      - uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          commit-message: "chore(nix): flake.lock を更新"
          branch: chore/flake-update
          title: "chore(nix): flake.lock を更新"
          body: |
            `nix flake update` による自動更新。

            適用前に `nix build --impure` でビルド確認を推奨。
          add-paths: nix/flake.lock
