# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Personal (non-development) setup for a Windows machine.
# Usage: winget configure -f configuration.personal.dsc.yaml
# app-volume.ahk (deployed by chezmoi) drives NirCmd through AutoHotkey.
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: autohotkey
      directives:
        description: Install AutoHotkey v2
      settings:
        id: AutoHotkey.AutoHotkey
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: argus
      directives:
        description: Install Argus task manager
      settings:
        id: Ray-lea.Argus
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: kando
      directives:
        description: Install Kando pie menu
      settings:
        id: KandoMenu.Kando
        source: winget

    # NirCmd is not in the winget repository, so fetch the official zip.
    # NirSoft overwrites the zip in place on each release; when the hash check
    # fails, review the new release and update the hash in both scripts.
    - resource: PSDscResources/Script
      id: nircmd
      directives:
        description: Install NirCmd into %LOCALAPPDATA%\Programs\NirCmd and add it to user PATH
      settings:
        GetScript: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\NirCmd'
          @{ Result = (Test-Path (Join-Path $dir 'nircmd.exe')).ToString() }
        TestScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\NirCmd'
          Test-Release -Name NirCmd -Sha256 '51e34ed379dd099a96bbf0a2266003361e2864fe3ef2f8baed76634909763a7c' -Require (Join-Path $dir 'nircmd.exe') -PathDir $dir
        SetScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          # SHA256 of nircmd-x64.zip v2.87 (same value as Scoop's main bucket manifest)
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\NirCmd'
          Install-Release -Name NirCmd -Sha256 '51e34ed379dd099a96bbf0a2266003361e2864fe3ef2f8baed76634909763a7c' -Dir $dir -Extract '*' -Require (Join-Path $dir 'nircmd.exe') -AddToPath `
            -Url 'https://www.nirsoft.net/utils/nircmd-x64.zip'

    # BatteryHub (formerly Wireless Battery) is not in the winget repository, so fetch
    # the portable zip from the GitHub release. To upgrade, change the URL and the hash
    # in both scripts (portable zip line of SHA256SUMS.txt).
    - resource: PSDscResources/Script
      id: batteryHub
      directives:
        description: Install BatteryHub into %LOCALAPPDATA%\Programs\BatteryHub
      settings:
        GetScript: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\BatteryHub'
          @{ Result = (Test-Path (Join-Path $dir 'BatteryHub.exe')).ToString() }
        TestScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\BatteryHub'
          Test-Release -Name BatteryHub -Sha256 '7a97a1ff0aefa895386077093b23a714df549a08fad3b1b9c37ccf2100a27026' -Require (Join-Path $dir 'BatteryHub.exe')
        SetScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\BatteryHub'
          Install-Release -Name BatteryHub -Sha256 '7a97a1ff0aefa895386077093b23a714df549a08fad3b1b9c37ccf2100a27026' -Dir $dir -Extract '*' -Require (Join-Path $dir 'BatteryHub.exe') `
            -Url 'https://github.com/krisgfx9/Wireless-Device-Battery-Monitor/releases/download/v1.1.0/BatteryHub-1.1.0-portable.zip'
