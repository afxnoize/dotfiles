# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Development setup for a Windows machine.
# Usage: winget configure -f configuration.dev.dsc.yaml
# Windows counterpart of nix/modules/packages.nix. Tools without a Windows build
# (nix tooling, cage, tmux) are left out.
properties:
  configurationVersion: 0.2.0
  resources:
    # --- System settings ---
    - resource: Microsoft.Windows.Settings/WindowsSettings
      id: developerMode
      directives:
        description: Enable Developer Mode so chezmoi can create symlinks without elevation
        securityContext: elevated
        allowPrerelease: true
      settings:
        DeveloperMode: true

    - resource: PSDscResources/Script
      id: xdgConfigHome
      directives:
        description: Set user XDG_CONFIG_HOME to ~/.config so nvim reads the shared config
      settings:
        GetScript: |
          @{ Result = [Environment]::GetEnvironmentVariable('XDG_CONFIG_HOME', 'User') }
        TestScript: |
          [Environment]::GetEnvironmentVariable('XDG_CONFIG_HOME', 'User') -eq (Join-Path $env:USERPROFILE '.config')
        SetScript: |
          [Environment]::SetEnvironmentVariable('XDG_CONFIG_HOME', (Join-Path $env:USERPROFILE '.config'), 'User')

    # --- Shell ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powershell
      directives:
        description: Install PowerShell 7
      settings:
        id: Microsoft.PowerShell
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ohMyPosh
      directives:
        description: Install oh-my-posh
      settings:
        id: JanDeDobbeleer.OhMyPosh
        source: winget
    - resource: PSDscResources/Script
      id: wezterm
      directives:
        description: Install WezTerm nightly from the GitHub nightly release
        securityContext: elevated
      settings:
        GetScript: |
          $exe = Join-Path $env:ProgramFiles 'WezTerm\wezterm.exe'
          @{ Result = $(if (Test-Path $exe) { [string](& $exe --version) } else { '' }) }
        TestScript: |
          # 20240203-110809-5046fc22 is the last stable release; any other
          # version string means a nightly build is installed.
          $exe = Join-Path $env:ProgramFiles 'WezTerm\wezterm.exe'
          (Test-Path $exe) -and ([string](& $exe --version) -notmatch '20240203-110809-5046fc22')
        SetScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $installer = Save-Download -Url 'https://github.com/wezterm/wezterm/releases/download/nightly/WezTerm-nightly-setup.exe'
          try {
            $proc = [Diagnostics.Process]::Start($installer, '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-')
            $proc.WaitForExit()
            if ($proc.ExitCode) { throw "WezTerm nightly installer failed with exit code $($proc.ExitCode)" }
          } finally {
            [IO.File]::Delete($installer)
          }
    - resource: PSDscResources/Script
      id: fonts
      directives:
        description: Install Cica, UDEV Gothic and PleckJP for the current user
      settings:
        GetScript: |
          $dir = Join-Path $env:LOCALAPPDATA 'dotfiles\releases'
          @{ Result = ('Cica', 'UDEVGothic', 'PleckJP' | Where-Object { Test-Path (Join-Path $dir $_) }) -join ',' }
        TestScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          (Test-Release -Name Cica -Sha256 'cbd1bcf1f3fd1ddbffe444369c76e42529add8538b25aeb75ab682d398b0506f') -and
            (Test-Release -Name UDEVGothic -Sha256 'c104c171f6ed8922ca52d74cd915a271e427f1e884e51431aae71d99e8b3b47b') -and
            (Test-Release -Name PleckJP -Sha256 'ba58f5a6862099d126a47a353de8e8a909da5311a6d8848f36d32bc9d0abdf80')
        SetScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $fontDir = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\Fonts'
          Install-Release -Name Cica -Sha256 'cbd1bcf1f3fd1ddbffe444369c76e42529add8538b25aeb75ab682d398b0506f' -Dir $fontDir -Extract 'Cica-*.ttf' -RegisterFont `
            -Url 'https://github.com/miiton/Cica/releases/download/v5.0.3/Cica_v5.0.3.zip'
          Install-Release -Name UDEVGothic -Sha256 'c104c171f6ed8922ca52d74cd915a271e427f1e884e51431aae71d99e8b3b47b' -Dir $fontDir -Extract 'UDEVGothic-*.ttf' -RegisterFont `
            -Url 'https://github.com/yuru7/udev-gothic/releases/download/v2.2.0/UDEVGothic_v2.2.0.zip'
          Install-Release -Name PleckJP -Sha256 'ba58f5a6862099d126a47a353de8e8a909da5311a6d8848f36d32bc9d0abdf80' -Dir $fontDir -Extract 'PleckJP-*.ttf' -RegisterFont `
            -Url 'https://github.com/ryota2357/PleckJP/releases/download/v2.2.1/PleckJP_v2.2.1.zip'

    # --- VCS ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Install Git
      settings:
        id: Git.Git
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: gh
      directives:
        description: Install GitHub CLI
      settings:
        id: GitHub.cli
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ghtkn
      directives:
        description: Install ghtkn (git credential helper backed by GitHub App user access tokens)
      settings:
        id: suzuki-shunsuke.ghtkn
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ghq
      directives:
        description: Install ghq
      settings:
        id: x-motemen.ghq
        source: winget

    # --- Editor ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: neovim
      directives:
        description: Install Neovim
      settings:
        id: Neovim.Neovim
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: treeSitter
      directives:
        description: Install tree-sitter CLI (nvim-treesitter compiles parsers with it)
      settings:
        id: tree-sitter.tree-sitter-cli
        source: winget

    # --- CLI tools ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fzf
      directives:
        description: Install fzf
      settings:
        id: junegunn.fzf
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ripgrep
      directives:
        description: Install ripgrep
      settings:
        id: BurntSushi.ripgrep.MSVC
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fd
      directives:
        description: Install fd
      settings:
        id: sharkdp.fd
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: bat
      directives:
        description: Install bat
      settings:
        id: sharkdp.bat
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: bottom
      directives:
        description: Install bottom
      settings:
        id: Clement.bottom
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: eza
      directives:
        description: Install eza
      settings:
        id: eza-community.eza
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: jq
      directives:
        description: Install jq
      settings:
        id: jqlang.jq
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: zoxide
      directives:
        description: Install zoxide
      settings:
        id: ajeetdsouza.zoxide
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: yazi
      directives:
        description: Install yazi
      settings:
        id: sxyazi.yazi
        source: winget

    # --- Dev tools ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mise
      directives:
        description: Install mise
      settings:
        id: jdx.mise
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: just
      directives:
        description: Install just
      settings:
        id: Casey.Just
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chezmoi
      directives:
        description: Install chezmoi
      settings:
        id: twpayne.chezmoi
        source: winget

    # --- Secrets ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: bitwardenCli
      directives:
        description: Install Bitwarden CLI
      settings:
        id: Bitwarden.CLI
        source: winget
    # On upgrade, change the URL and the hash in both scripts (amd64.exe line of sops-v<version>.checksums.txt).
    - resource: PSDscResources/Script
      id: sops
      directives:
        description: Install sops into %LOCALAPPDATA%\Programs\sops and add it to user PATH
      settings:
        GetScript: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\sops\sops.exe'
          @{ Result = $(if (Test-Path $exe) { [string](& $exe --disable-version-check --version) } else { '' }) }
        TestScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\sops'
          Test-Release -Name sops -Sha256 'a4a9a398858fe8b2ef72d9686d930bf7c5cece9be74ad83ac3b53cfdd70e6b1c' -Require (Join-Path $dir 'sops.exe') -PathDir $dir
        SetScript: |
          . ([scriptblock]::Create([IO.File]::ReadAllText('${WinGetConfigRoot}\scripts\release.ps1')))
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\sops'
          Install-Release -Name sops -Sha256 'a4a9a398858fe8b2ef72d9686d930bf7c5cece9be74ad83ac3b53cfdd70e6b1c' -Dir $dir -FileName sops.exe -Require (Join-Path $dir 'sops.exe') -AddToPath `
            -Url 'https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.amd64.exe'
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: age
      directives:
        description: Install age
      settings:
        id: FiloSottile.age
        source: winget

    # --- AI ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claudeCode
      directives:
        description: Install Claude Code
      settings:
        id: Anthropic.ClaudeCode
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: t3code
      directives:
        description: Install T3 Code
      settings:
        id: T3Tools.T3Code
        source: winget
